name: frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd src/mjswan/template
          npm install

      - name: Run eslint
        run: |
          cd src/mjswan/template
          npx eslint .

      # Node-only unit tests. The engine runtime needs WebGL + WASM and is
      # covered by the browser harness instead (vitest.config.ts).
      - name: Run vitest
        run: |
          cd src/mjswan/template
          npm test
