name: frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd src/mjswan/template
          npm install

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The engine imports five stubs that only the Python build writes, so a
      # fresh checkout cannot compile the template without generating them.
      - name: Generate the build-time stubs
        run: |
          uv pip install --system -e .
          python -c "from pathlib import Path; from mjswan._build_client import ClientBuilder; b = ClientBuilder(Path('src/mjswan/template')); b.generate_empty_custom_stubs(); b.generate_viewer_config_defaults()"

      - name: Run eslint
        run: |
          cd src/mjswan/template
          npx eslint .

      # Node-only unit tests. The engine runtime needs WebGL + WASM and is
      # covered by the browser harness instead (vitest.config.ts).
      - name: Run vitest
        run: |
          cd src/mjswan/template
          npm test
